<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego de preguntas con bonequitos y diálogos: adivina qué pasa después en Yo soy Betty, la fea.">
<meta name="theme-color" content="#0e0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Y ahora qué, Betty?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>¿Y ahora qué, Betty?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,800;1,6..96,500&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;800&family=Special+Elite&family=Shadows+Into+Light&display=swap">
<style>
/* Layout: el diario de Betty — cuaderno rayado con margen rojo; escenas como conversaciones que se escriben solas, con bonequitos animados. */
:root{
  --paper:#0e0c10; --line:#3a3340; --margin:#5c2b33;
  --ink:#f3efe8; --muted:#aba2a8;
  --plum:#e0a84a; --plum-soft:#2b2216;
  --mustard:#b7c9ee; --mustard-soft:#1b2232;
  --ok:#86d7a2; --ok-soft:#18301f; --bad:#f19494; --bad-soft:#3a1d20;
  --card:#1a171d; --shadow:rgba(0,0,0,.5);
  --bubble:#f6f1e6; --bubble-ink:#231d26; --bubble-line:#ddd2bf; --bubble2:#e3eafb; --brown:#8a5a2b; --brown2:#3a4f86;
  --diary:#f6efdc; --diary-ink:#2a2233; --diary-muted:#7a6f68; --diary-line:#c9d6ea; --diary-margin:#e08a8a; --letter:#f7f3e8;
  --chalk:#f4f7ff; --glow:rgba(170,195,255,.55);
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --chalkfont:"Shadows Into Light","Caveat","Bradley Hand",cursive;
  --type:"Special Elite","Courier New",monospace;
  --body:"Nunito Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
/* Una sola identidad, oscura como la presentación de la novela. */

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  background-image:radial-gradient(ellipse at 50% -10%, #2a2230 0%, transparent 60%);
  background-attachment:fixed; min-height:100vh;
}
.wrap{max-width:780px; margin:0 auto; padding-block:64px 64px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}

a{color:var(--plum)}

header.mast{display:flex; flex-direction:column; gap:4px; margin-bottom:22px}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:800}
h1{font-family:var(--chalkfont); font-weight:400; font-size:clamp(40px,9vw,66px); line-height:1.05; margin:0; color:var(--chalk); text-shadow:0 0 14px var(--glow), 0 0 2px var(--glow); text-wrap:balance}
h2{font-family:var(--display); font-weight:800; font-size:26px; margin:0; text-wrap:balance}
h3{margin:0; font-size:15px}

.btn{font:inherit; font-weight:800; border:2px solid var(--plum); background:var(--plum); color:var(--paper);
  padding:12px 22px; border-radius:999px; cursor:pointer; font-size:16px; transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent; color:var(--plum)}
.btn.small{padding:6px 14px; font-size:13.5px}
.btn:focus-visible,.opt:focus-visible,.quote-card:focus-visible{outline:3px solid var(--mustard); outline-offset:3px}

/* ---------- Bonequitos animados ---------- */
svg.doll{display:block; width:100%; height:auto; overflow:visible}
svg.doll .hd, svg.doll .eyes, svg.doll .om, svg.doll .bd{transform-box:view-box}
svg.doll .hd{transform-origin:50px 74px}
svg.doll .eyes{transform-origin:50px 46.5px}
svg.doll .om{opacity:0}
@media (prefers-reduced-motion:no-preference){
  svg.doll .hd{animation:bob 3.4s ease-in-out infinite; animation-delay:var(--d,0s)}
  svg.doll .bd{transform-origin:50px 112px; animation:breathe 3.4s ease-in-out infinite; animation-delay:var(--d,0s)}
  svg.doll .eyes{animation:blink 5s infinite; animation-delay:var(--d,0s)}
  .fig.talk svg.doll .hd{animation:nod .55s ease-in-out infinite alternate}
  .fig.talk svg.doll .om{animation:mouth .2s steps(2,jump-none) infinite alternate}
  .fig.write svg.doll .hd{animation:write 1.1s ease-in-out infinite alternate}
  .fig:hover svg.doll .hd{animation:wave .6s ease-in-out 2 alternate}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.2px) rotate(1.2deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  @keyframes nod{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-1.5px)}}
  @keyframes mouth{from{opacity:0}to{opacity:1}}
  @keyframes write{from{transform:rotate(4deg) translateY(1px)}to{transform:rotate(7deg) translateY(2px)}}
  @keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
}
@media (prefers-reduced-motion:reduce){ .fig.talk svg.doll .om{opacity:1} }

/* ---------- Intro ---------- */
.intro{display:flex; flex-direction:column; gap:18px}
.intro p{max-width:60ch; margin:0}
.lineup{display:flex; flex-wrap:wrap; align-items:flex-end; padding-top:8px}
.lineup .fig{width:clamp(52px,12vw,80px); margin-right:-8px}
.hero-say{display:flex; align-items:flex-end; gap:10px}
.hero-say .fig{flex:0 0 92px}
.cast{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.person{display:flex; gap:12px; align-items:center; background:var(--card); padding:10px 12px; border-radius:10px; box-shadow:0 1px 0 var(--shadow), 0 4px 14px var(--shadow)}
.person > div:last-child{min-width:0}
.person p{margin:2px 0 0; font-size:13.5px; color:var(--muted); line-height:1.4}
.person .pic{flex:0 0 64px; display:flex; align-items:flex-end; justify-content:center}
.person .pic.group{flex-basis:92px}
.person .pic.group .fig{width:30px; margin-right:-6px}
.actor{display:block; font-size:12px; font-weight:700; color:var(--mustard); margin-top:1px}
.cta-row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.best{font-family:var(--hand); font-size:22px; color:var(--muted)}

/* ---------- Diálogos ---------- */
.dlg{display:flex; flex-direction:column; gap:12px}
.ln{display:flex; gap:10px; align-items:flex-end}
.ln.r{flex-direction:row-reverse}
.ln .fig{flex:0 0 62px}
.bub{position:relative; min-width:0; max-width:min(78%,480px); background:var(--bubble); color:var(--bubble-ink); border:2px solid var(--bubble-line); border-radius:16px; border-bottom-left-radius:4px; padding:8px 13px 9px; font-size:15.5px; line-height:1.4}
.ln.r .bub{border-bottom-left-radius:16px; border-bottom-right-radius:4px}
.bub .who{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--brown); margin-bottom:2px}
.bub .star{display:block; margin-top:4px; font-size:11px; font-weight:800; color:var(--brown); letter-spacing:.04em}
.dlg.after .bub{background:var(--bubble2); border-color:transparent}
.dlg.after .bub .who{color:var(--brown2)}
.caret::after{content:"▌"; color:var(--plum); margin-left:1px; animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.typing{display:inline-flex; gap:4px; padding:4px 2px}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .ln{animation:enter .35s ease-out}
  .ln.r{animation-name:enterR}
  @keyframes enter{from{transform:translateX(-14px); opacity:0}to{transform:none; opacity:1}}
  @keyframes enterR{from{transform:translateX(14px); opacity:0}to{transform:none; opacity:1}}
}

/* ---------- Juego ---------- */
.hud{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:14px; color:var(--muted); font-weight:700}
.hud b{color:var(--ink); font-variant-numeric:tabular-nums}
.bar{flex:1 1 160px; height:8px; background:var(--plum-soft); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--plum); transition:width .4s}
.scene{background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 0 var(--shadow), 0 8px 24px var(--shadow); display:flex; flex-direction:column; gap:14px}
.scene-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.act{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mustard); font-weight:800}
.situ{margin:0; font-size:15px; color:var(--muted); font-style:italic}
.q{font-family:var(--display); font-style:italic; font-size:21px; margin:0; color:var(--plum); text-wrap:balance}
.qbox{display:flex; flex-direction:column; gap:12px}
.opts{display:grid; gap:10px}
.opt{font:inherit; text-align:left; display:flex; gap:12px; align-items:flex-start; background:var(--paper); color:var(--ink);
  border:2px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--plum)}
.opt .k{flex:0 0 26px; height:26px; border-radius:50%; background:var(--mustard-soft); color:var(--mustard); display:grid; place-items:center; font-weight:800; font-size:13px}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); color:var(--card)}
.opt.dim{opacity:.55}
.diary{border-top:2px dashed var(--line); padding-top:14px; display:flex; flex-direction:column; gap:12px}
.verdict{font-weight:800; font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.note{margin:0; font-family:var(--hand); font-size:23px; line-height:1.25; color:var(--ink)}
.note::before{content:"Querido diario: "; color:var(--plum)}
.next-row{display:flex; justify-content:flex-end}

/* ---------- Páginas del diario y la carta ---------- */
.inter{display:flex; flex-direction:column; gap:16px}
.page{position:relative; background-color:var(--diary); color:var(--diary-ink); border-radius:6px 14px 14px 6px; box-shadow:0 1px 0 var(--shadow), 0 10px 30px var(--shadow);
  padding:22px 20px 26px 58px;
  background-image:
    linear-gradient(90deg, transparent 0 40px, var(--diary-margin) 40px 42px, transparent 42px),
    repeating-linear-gradient(to bottom, transparent 0 33px, var(--diary-line) 33px 34px);
  background-position:0 14px}
.page .date{font-family:var(--hand); font-size:22px; color:var(--diary-muted); line-height:34px; margin:0}
.page .entry{font-family:var(--hand); font-size:clamp(22px,4.6vw,27px); line-height:34px; margin:0; white-space:pre-wrap; color:var(--diary-ink); min-height:136px}
.page .writer{position:absolute; right:12px; top:-46px; width:80px}
.quote{border-left:4px solid var(--plum); background:var(--plum-soft); padding:12px 14px; border-radius:0 10px 10px 0}
.quote p{margin:0; font-family:var(--hand); font-size:28px; line-height:1.15; color:var(--plum)}
.quote small{display:block; margin-top:6px; font-size:12.5px; color:var(--muted)}
.letter{background:var(--letter); border:1px solid var(--line); box-shadow:0 2px 0 var(--shadow), 0 14px 34px var(--shadow); padding:26px 22px; transform:rotate(-.6deg); border-radius:2px}
.letter .memo{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-family:var(--type); font-size:13px; color:var(--diary-muted); border-bottom:1px dashed var(--line); padding-bottom:10px; margin-bottom:14px}
.letter .body{font-family:var(--type); font-size:15.5px; line-height:1.7; white-space:pre-wrap; margin:0; min-height:240px; color:var(--diary-ink)}
.credit-note{font-size:13px; color:var(--muted); margin:0; max-width:62ch}
.inter-head{display:flex; align-items:flex-end; gap:12px}
.inter-head .fig{flex:0 0 74px}

/* ---------- Frases célebres ---------- */
.frases{display:flex; flex-direction:column; gap:16px}
.qgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.quote-card{font:inherit; color:inherit; text-align:left; cursor:pointer; display:flex; gap:12px; align-items:flex-start; background:var(--card); border:0; border-radius:12px; padding:12px; box-shadow:0 1px 0 var(--shadow), 0 4px 14px var(--shadow)}
.quote-card .fig{flex:0 0 58px}
.quote-card > div{min-width:0}
.quote-card .qt{font-family:var(--display); font-style:italic; font-size:18px; line-height:1.25; color:var(--plum); min-height:1.25em}
.quote-card .by{font-size:12.5px; font-weight:800; margin-top:4px}
.quote-card .cx{font-size:13px; color:var(--muted); margin-top:2px}
.sources{font-size:13px; color:var(--muted); margin:0; padding-left:18px}

/* ---------- Final y créditos ---------- */
.end{display:flex; flex-direction:column; gap:16px; align-items:flex-start}
.end-top{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.end-top .fig{width:110px}
.big{font-family:var(--display); font-weight:800; font-size:clamp(56px,14vw,96px); line-height:1; color:var(--plum); font-variant-numeric:tabular-nums}
.big small{font-size:.4em; color:var(--muted)}
.rank{background:var(--mustard-soft); border-radius:12px; padding:16px 18px; max-width:60ch}
.rank h2{color:var(--mustard)}
.rank p{margin:6px 0 0}
.review{display:flex; flex-direction:column; gap:6px; width:100%; padding:0; margin:0; list-style:none}
.review li{display:flex; gap:10px; font-size:14px; align-items:baseline}
.review li b{flex:0 0 18px}
.review .y{color:var(--ok)} .review .n{color:var(--bad)}
.credits{display:flex; flex-direction:column; gap:10px; width:100%; background:var(--card); border-radius:12px; padding:18px 20px; box-shadow:0 1px 0 var(--shadow), 0 4px 14px var(--shadow)}
.credits dl{display:grid; grid-template-columns:minmax(0,170px) minmax(0,1fr); gap:6px 16px; margin:0; font-size:14.5px}
.credits dt{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--muted); padding-top:2px}
.credits dd{margin:0; min-width:0}
@media (max-width:520px){.credits dl{grid-template-columns:1fr}.credits dd{margin-bottom:6px}}
.install{display:flex; flex-direction:column; gap:8px; background:var(--plum-soft); border:2px solid var(--plum); border-radius:12px; padding:14px 16px}
.install b{color:var(--plum)}
.install ol{margin:0; padding-left:20px; font-size:14.5px}
.install .row{display:flex; justify-content:flex-end}
/* ---------- Menú inicial y entrada a Ecomoda ---------- */
.mbtn{position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 12px); right:calc(env(safe-area-inset-right,0px) + 12px); width:44px; height:44px; border-radius:50%; border:2px solid var(--plum); background:var(--card); color:var(--plum); font-size:20px; line-height:1; cursor:pointer; display:grid; place-items:center}
.mbtn[aria-pressed="false"]{opacity:.55}
.mbtn[aria-pressed="false"]::after{content:""; position:absolute; width:28px; height:2px; background:var(--plum); transform:rotate(-45deg)}
.mbtn:focus-visible{outline:3px solid var(--mustard); outline-offset:3px}
.topbar{display:flex; align-items:center; gap:12px; margin:-40px 0 18px; padding-right:52px; flex-wrap:wrap}
.topbar .brand{font-family:var(--chalkfont); font-size:24px; color:var(--chalk); text-shadow:0 0 10px var(--glow)}
.menu{display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; margin-top:-36px}
.stage{position:relative; width:100%; aspect-ratio:160/110; border-radius:14px; overflow:hidden; box-shadow:0 10px 40px var(--shadow)}
.stage svg.bld{position:absolute; inset:0; width:100%; height:100%}
.walker{position:absolute; bottom:7%; left:-14%; width:11%}
.walker .say{position:absolute; bottom:100%; left:40%; width:max-content; max-width:min(230px,58vw); background:var(--bubble); color:var(--bubble-ink); font-size:clamp(11px,2.4vw,14px); padding:6px 10px; border-radius:12px; border-bottom-left-radius:3px; line-height:1.3; text-align:left; box-shadow:0 4px 14px var(--shadow)}
.door{transform-box:fill-box; transition:transform .55s ease}
.doors-open .doorL{transform:translateX(-96%)}
.doors-open .doorR{transform:translateX(96%)}
.menu .tag{color:var(--muted); margin:0; max-width:46ch}
.menu-btns{display:flex; flex-direction:column; gap:10px; width:min(100%,340px)}
.menu-btns .btn{width:100%}
.splash-btn{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); font-size:18px; padding:14px 26px; box-shadow:0 6px 24px rgba(0,0,0,.55)}
.splash-btn:hover{transform:translate(-50%,-53%)}
.skip-intro{position:absolute; right:10px; bottom:10px}
@media (prefers-reduced-motion:no-preference){
  .walker.walking .fig{animation:walk .34s ease-in-out infinite alternate}
  @keyframes walk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8%) rotate(4deg)}}
  .menu-btns:not([hidden]),.menu .tag:not([hidden]){animation:in .5s ease-out}
}
/* Patricia en la junta: todos la miran */
.stare{display:flex; flex-direction:column; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px}
.stare .stare-bub{max-width:100%; align-self:flex-start; font-size:17px}
.stare-row{display:flex; align-items:flex-end; gap:6px}
.stare-p{flex:0 0 clamp(60px,18%,86px)}
.watchers{flex:1 1 0; min-width:0; display:flex; align-items:flex-end; justify-content:flex-end; gap:2px; border-bottom:9px solid var(--brown); border-radius:0 0 3px 3px; padding-left:4px}
.wslot{flex:1 1 0; min-width:0; max-width:66px}
.stare-cap{margin:0; font-style:italic; color:var(--muted); font-size:14.5px; min-height:1.4em}
@media (prefers-reduced-motion:no-preference){
  .fig.jolt{animation:jolt .38s ease-out}
  @keyframes jolt{0%{transform:none}35%{transform:translateY(-12%) rotate(-4deg)}100%{transform:none}}
}
/* Guía de instalación */
kbd{font-family:var(--body); font-weight:800; font-size:.92em; background:var(--card); color:var(--ink); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; white-space:nowrap}
.guide{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; text-align:left; width:100%}
.gcard{background:var(--card); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 0 var(--shadow), 0 4px 14px var(--shadow); min-width:0}
.gcard h3{font-size:17px; color:var(--plum); display:flex; align-items:center; gap:8px}
.gcard h3 small{font-size:12px; color:var(--muted); font-weight:700}
.gcard ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px}
.gcard.first{order:-1; outline:2px solid var(--plum)}
.guide .warn{grid-column:1/-1; background:var(--mustard-soft); border-radius:10px; padding:12px 14px; font-size:14.5px; margin:0}
.urlbox{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.urlbox code{font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; user-select:all; overflow-wrap:anywhere; min-width:0}
.install-view{display:flex; flex-direction:column; gap:14px}
.install-view p{margin:0; max-width:62ch}
.btn small{display:block; font-size:12.5px; font-weight:600; opacity:.85; margin-top:1px}
.menu-btns .btn.danger{border-color:var(--bad); color:var(--bad)}
footer{margin-top:36px; font-size:12.5px; color:var(--muted); max-width:60ch}
@media (prefers-reduced-motion:no-preference){
  .scene,.inter,.frases{animation:in .35s ease-out}
  @keyframes in{from{transform:translateY(8px); opacity:.6}to{transform:none; opacity:1}}
}

/* Reset que en el artifact ponía la plataforma */
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Pantalla de instalación obligatoria en celulares */
.gated header.mast,.gated footer{display:none}
.gate{min-height:calc(100dvh - 80px); display:flex; flex-direction:column; justify-content:center; gap:16px; max-width:460px; margin:0 auto}
.gate .fig{width:120px}
.gate h2{font-size:30px; color:var(--plum)}

<script>
/* ================= Bonequitos (SVG generado) ================= */
const SKIN = {l:"#f2c9a5", m:"#dfa97f", t:"#c38b62"};
const LOOK = {
  betty:   {skin:"m", hair:"bob",   hc:"#2b1d14", top:"sweater", oc:"#8f6430", collar:1, glasses:1, braces:1},
  betty2:  {skin:"m", hair:"wavy",  hc:"#3a2418", top:"dress",   oc:"#b3263a", earrings:1, lips:1},
  armando: {skin:"l", hair:"short", hc:"#1e1612", top:"suit",    oc:"#23344f", tie:"#7a1f2b"},

  daniel:  {skin:"l", hair:"slick", hc:"#2a2018", top:"suit",    oc:"#1c1c22", tie:"#555a66"},

  michel:  {skin:"l", hair:"short", hc:"#b38a4f", top:"open",    oc:"#f1ede4"},
  hermes:  {skin:"m", hair:"bald",  hc:"#9a9a9a", top:"sweater", oc:"#6b5a3a", collar:1, mustache:"#5a5a5a"},
  julia:   {skin:"m", hair:"bun",   hc:"#6e5a4a", top:"sweater", oc:"#8a6a8a", collar:1},
  freddy:  {skin:"t", hair:"short", hc:"#1a1210", top:"sweater", oc:"#3a6ea5", collar:1, cap:"#c0392b"},
  inesita: {skin:"l", hair:"bun",   hc:"#cfc9c0", top:"sweater", oc:"#9c88b8", collar:1, glasses:1},
  bertha:  {skin:"m", hair:"curly", hc:"#3a2418", top:"dress",   oc:"#5c7fb0", wide:1},
  aura:    {skin:"t", hair:"long",  hc:"#1a1210", top:"dress",   oc:"#e07a3a", earrings:1, lips:1},
  sandra:  {skin:"l", hair:"pixie", hc:"#4a3020", top:"sweater", oc:"#7a9a6a", collar:1, tall:1},
  mariana: {skin:"t", hair:"curly", hc:"#1a1210", top:"dress",   oc:"#7a3a8a", band:"#e8b44a", earrings:1}
};
function doll(key, mood="neutral", look=0){
  const L = LOOK[key], sk = SKIN[L.skin], hc = L.hc, dy = L.tall ? -7 : 0;
  let back = "", front = "";
  switch(L.hair){
    case "bob":    back = `<rect x="28" y="28" width="44" height="38" rx="12" fill="${hc}"/>`;
                   front = `<path d="M31 41 Q30 22 50 22 Q70 22 69 41 Z" fill="${hc}"/>`; break;
    case "long":   back = `<rect x="27" y="30" width="46" height="54" rx="16" fill="${hc}"/>`;
                   front = `<path d="M31 46 Q30 23 52 23 Q70 24 69 46 Q64 31 46 32 Q36 35 31 46Z" fill="${hc}"/>`; break;
    case "wavy":   back = `<rect x="26" y="30" width="48" height="52" rx="18" fill="${hc}"/><circle cx="28" cy="76" r="7" fill="${hc}"/><circle cx="72" cy="76" r="7" fill="${hc}"/>`;
                   front = `<path d="M31 48 Q29 22 53 23 Q71 25 69 48 Q65 30 44 31 Q35 36 31 48Z" fill="${hc}"/>`; break;
    case "volume": back = `<ellipse cx="50" cy="47" rx="32" ry="31" fill="${hc}"/>`;
                   front = `<path d="M30 46 Q29 21 52 21 Q72 22 70 46 Q66 30 48 30 Q36 33 30 46Z" fill="${hc}"/>`; break;
    case "bun":    back = `<circle cx="50" cy="21" r="9" fill="${hc}"/>`;
                   front = `<path d="M31 43 Q30 24 50 24 Q70 24 69 43 Q62 32 50 32 Q38 32 31 43Z" fill="${hc}"/>`; break;
    case "short":  front = `<path d="M31 43 Q29 22 50 22 Q71 22 69 43 Q66 31 50 31 Q36 31 31 43Z" fill="${hc}"/>`; break;
    case "slick":  front = `<path d="M31 40 Q31 22 50 22 Q69 22 69 40 Q63 27 44 30 Q36 32 31 40Z" fill="${hc}"/>`; break;
    case "bowl":   front = `<path d="M30 50 Q29 21 50 21 Q71 21 70 50 L66 50 L66 39 L34 39 L34 50Z" fill="${hc}"/>`; break;
    case "pixie":  front = `<path d="M30 48 Q29 22 50 22 Q71 22 70 48 Q66 33 52 32 Q38 33 34 40 Q32 44 30 48Z" fill="${hc}"/>`; break;
    case "bald":   front = `<ellipse cx="31.5" cy="44" rx="3.5" ry="8" fill="${hc}"/><ellipse cx="68.5" cy="44" rx="3.5" ry="8" fill="${hc}"/>`; break;
    case "curly":  back = [[30,46],[70,46],[29,56],[71,56]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${hc}"/>`).join("");
                   front = [[33,36],[40,28],[50,25],[60,28],[67,36]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="${hc}"/>`).join(""); break;
  }
  if (L.band) front += `<path d="M32 34 Q50 24 68 34" stroke="${L.band}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if (L.cap)  front += `<path d="M30 36 Q30 19 50 19 Q70 19 70 36Z" fill="${L.cap}"/><path d="M50 34 L78 36 Q74 39 50 38Z" fill="${L.cap}"/>`;

  const bodyD = L.wide ? "M8 112 Q10 76 50 73 Q90 76 92 112Z" : "M17 112 Q19 79 50 75 Q81 79 83 112Z";
  let top = `<path d="${bodyD}" fill="${L.oc}"/>`;
  if (L.top === "suit") top += `<polygon points="43,75 57,75 50,93" fill="#f4f1ea"/><polygon points="48.5,77 51.5,77 53.5,92 50,97 46.5,92" fill="${L.tie}"/><path d="M43 75 L50 96 M57 75 L50 96" stroke="rgba(0,0,0,.25)" stroke-width="1.4"/>`;
  if (L.top === "open") top += `<polygon points="44,75 56,75 50,88" fill="${sk}"/><path d="M44 75 L50 88 L56 75" stroke="rgba(0,0,0,.18)" stroke-width="1.4" fill="none"/>`;
  if (L.top === "dress") top += `<path d="M42 75 Q50 85 58 75" fill="${sk}"/>`;
  if (L.collar) top += `<polygon points="42,74 50,80 45,85" fill="#f4ecd8"/><polygon points="58,74 50,80 55,85" fill="#f4ecd8"/>`;
  if (L.pearls) top += [38,42,46,50,54,58,62].map((x,i)=>`<circle cx="${x}" cy="${77+[0,3,5,6,5,3,0][i]}" r="1.7" fill="#fbf6ea" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>`).join("");
  if (L.scarf) top += `<path d="M41 70 Q50 79 59 70 L60 77 Q50 86 40 77Z" fill="${L.scarf}"/><path d="M53 80 L58 98 L50 96Z" fill="${L.scarf}"/>`;

  const ink = "#2a1d1d", lip = L.lips ? "#b0303f" : "#8a3a3a";
  const brows = {
    angry:`<path d="M39 39 L46 42 M61 39 L54 42" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`,
    sad:`<path d="M39 42 L46 39.5 M61 42 L54 39.5" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>`,
    surprised:`<path d="M39 37.5 Q43 35.5 47 37.5 M53 37.5 Q57 35.5 61 37.5" stroke="${ink}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`
  }[mood] || "";
  let mouth = {
    happy:`<path d="M44 54 Q50 62 56 54Z" fill="${lip}"/>`,
    sad:`<path d="M45 58 Q50 54 55 58" stroke="${lip}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
    angry:`<path d="M45 57 L55 57" stroke="${lip}" stroke-width="2" stroke-linecap="round"/>`,
    surprised:`<ellipse cx="50" cy="57" rx="2.6" ry="3.2" fill="${lip}"/>`,
    neutral:`<path d="M45 55.5 Q50 58.5 55 55.5" stroke="${lip}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
  }[mood];
  if (L.braces && (mood === "happy" || mood === "neutral"))
    mouth = `<rect x="43.5" y="53.5" width="13" height="5" rx="2.4" fill="#fff" stroke="#8a3a3a" stroke-width="1"/><path d="M44 56 L56 56" stroke="#8d97a3" stroke-width="1.2"/><path d="M47 54 V58 M50 54 V58 M53 54 V58" stroke="#8d97a3" stroke-width=".7"/>`;
  const openMouth = `<g class="om"><ellipse cx="50" cy="56.5" rx="4.2" ry="3.6" fill="#5a1f24"/>${L.braces?`<path d="M46.5 55 H53.5" stroke="#c9d0d8" stroke-width="1.4"/>`:""}<ellipse cx="50" cy="58.3" rx="2.4" ry="1.2" fill="#d46a6a"/></g>`;
  const eyes = mood === "happy" && !L.glasses
    ? `<path d="M41 47 Q43 44.5 45 47 M55 47 Q57 44.5 59 47" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<circle cx="43" cy="46.5" r="2.2" fill="${ink}"/><circle cx="57" cy="46.5" r="2.2" fill="${ink}"/><circle cx="43.7" cy="45.8" r=".7" fill="#fff"/><circle cx="57.7" cy="45.8" r=".7" fill="#fff"/>`;
  const gr = key === "betty" ? 7 : 6;
  const glasses = L.glasses ? `<g fill="rgba(255,255,255,.18)" stroke="#3a2a20" stroke-width="1.8"><circle cx="43" cy="46.5" r="${gr}"/><circle cx="57" cy="46.5" r="${gr}"/></g><path d="M49.5 46 L50.5 46" stroke="#3a2a20" stroke-width="1.8"/>` : "";
  const extras = (L.mustache ? `<path d="M42.5 52.5 Q50 48.5 57.5 52.5 Q50 55 42.5 52.5Z" fill="${L.mustache}"/>` : "")
    + (L.earrings ? `<circle cx="31" cy="53" r="2.2" fill="#e2b33c"/><circle cx="69" cy="53" r="2.2" fill="#e2b33c"/>` : "");
  const delay = (-(key.length * 0.37 + mood.length * 0.21) % 3).toFixed(2);

  return `<svg class="doll" viewBox="0 0 100 112" role="img" aria-label="${CAST_NAME(key)}" style="--d:${delay}s">
    <g class="bd">${top}</g>
    <rect x="44" y="${56+dy}" width="12" height="${20-dy}" fill="${sk}"/>
    <rect x="44" y="${56+dy}" width="12" height="5" fill="rgba(0,0,0,.08)"/>
    <g transform="translate(0 ${dy})"><g class="hd">
      ${back}
      <circle cx="31" cy="47" r="3.5" fill="${sk}"/><circle cx="69" cy="47" r="3.5" fill="${sk}"/>
      <circle cx="50" cy="44" r="19.5" fill="${sk}"/>
      <circle cx="38" cy="52" r="3.4" fill="#e66a6a" opacity=".25"/><circle cx="62" cy="52" r="3.4" fill="#e66a6a" opacity=".25"/>
      ${front}${brows}<g transform="translate(${look * 2.4} 0)"><g class="eyes">${eyes}</g></g>${glasses}${extras}${mouth}${openMouth}
    </g></g>
  </svg>`;
}
const fig = (k, mood, cls="", look=0) => `<div class="fig ${cls}">${doll(k, mood, look)}</div>`;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const STAR = `<span class="star">★ Frase de la novela</span>`;

async function typeInto(el, text, my, speed=26){
  el.classList.add("caret");
  for (let i = 1; i <= text.length; i++){
    if (skip || my !== token) break;
    el.textContent = text.slice(0, i);
    const c = text[i-1];
    await sleep(/[.!?…]/.test(c) ? 230 : /[,:;\n]/.test(c) ? 120 : speed);
  }
  el.textContent = text;
  el.classList.remove("caret");
}

const WATCHERS = ["armando","marcela","daniel","mario","betty"];
function stareHTML(text, cap, final){
  return `<div class="stare">
    <div class="bub stare-bub"><span class="who">Patricia</span><span class="tx">${final ? esc(text) : ""}</span>${STAR}</div>
    <div class="stare-row">
      <div class="stare-p">${fig("patricia","happy")}</div>
      <div class="watchers">${WATCHERS.map(w => `<div class="wslot" data-k="${w}">${fig(w, final ? "surprised" : "neutral", "", final ? -1 : 0)}</div>`).join("")}</div>
    </div>
    <p class="stare-cap">${final ? esc(cap) : ""}</p>
  </div>`;
}
function sides(lines){ const s = {}; let n = 0; lines.filter(([k]) => k[0] !== "@").forEach(([k]) => { const b = k.replace(/2$/,""); if (!(b in s)) s[b] = (n++) % 2; }); return s; }
function lineHTML(k, m, star, side, text, talk){
  return `<div class="ln ${side ? "r" : ""}">${fig(k, m, talk ? "talk" : "")}<div class="bub"><span class="who">${esc(CAST_NAME(k))}</span><span class="tx">${text}</span>${star ? STAR : ""}</div></div>`;
}
function staticDialogue(lines, cls=""){
  const s = sides(lines);
  return `<div class="dlg ${cls}">${lines.map(([k,t,m,star]) => k === "@stare" ? stareHTML(t, m, 1) : lineHTML(k, m, star, s[k.replace(/2$/,"")], esc(t))).join("")}</div>`;
}
async function playDialogue(box, lines, my){
  const s = sides(lines);
  for (const [k,t,m,star] of lines){
    if (my !== token) return false;
    if (k === "@stare"){
      box.insertAdjacentHTML("beforeend", stareHTML(t, m, 0));
      const el = box.lastElementChild, pf = el.querySelector(".stare-p .fig");
      el.scrollIntoView?.({block:"nearest", behavior: skip ? "auto" : "smooth"});
      pf.classList.add("talk");
      await typeInto(el.querySelector(".tx"), t, my, 60);
      pf.classList.remove("talk");
      if (!skip) await sleep(350);
      for (const w of el.querySelectorAll(".wslot")){
        if (my !== token) return false;
        w.innerHTML = fig(w.dataset.k, "surprised", "jolt", -1);
        if (!skip) await sleep(190);
      }
      if (!skip) await sleep(500);
      await typeInto(el.querySelector(".stare-cap"), m, my, 34);
      if (!skip) await sleep(900);
      continue;
    }
    const side = s[k.replace(/2$/,"")];
    if (!skip){
      box.insertAdjacentHTML("beforeend", lineHTML(k, m, 0, side, `<span class="typing" aria-label="escribiendo"><i></i><i></i><i></i></span>`, 0));
      await sleep(520);
      if (my !== token) return false;
      box.lastElementChild.remove();
    }
    box.insertAdjacentHTML("beforeend", lineHTML(k, m, star, side, "", 1));
    const ln = box.lastElementChild, f = ln.querySelector(".fig"), tx = ln.querySelector(".tx");
    ln.scrollIntoView?.({block:"nearest", behavior: skip ? "auto" : "smooth"});
    await typeInto(tx, t, my);
    f.classList.remove("talk");
    if (!skip) await sleep(320);
  }
  return my === token;
}


/* ================= Música: milonga original en 8 bits (WebAudio) =================
   Melodía compuesta para este juego, al estilo de un tango/milonga. No es «Se dice de mí». */
const Music = (() => {
  let ctx = null, master = null, timer = null, next = 0, step = 0, on = false;
  const S = 60 / 104 / 4;                       // semicorchea a 104 negras por minuto
  const n2f = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = ["Dm","Dm","A7","A7","A7","A7","Dm","Dm","Gm","Gm","Dm","Dm","A7","A7","Dm","Dm"];
  const BASS = {Dm:[50,57,62], A7:[45,52,57], Gm:[43,50,55]};
  const CHORD = {Dm:[62,65,69], A7:[61,64,67], Gm:[62,67,70]};
  const MEL = [
    [[0,69,3],[3,65,3],[6,62,2]], [[0,64,2],[2,65,2],[4,67,2],[6,69,2]],
    [[0,70,3],[3,69,3],[6,67,2]], [[0,64,6]],
    [[0,64,2],[2,67,2],[4,70,2],[6,73,2]], [[0,76,3],[3,74,3],[6,73,2]],
    [[0,74,3],[3,69,3],[6,65,2]], [[0,62,6]],
    [[0,67,3],[3,70,3],[6,74,2]], [[0,77,3],[3,76,1],[4,74,4]],
    [[0,69,3],[3,74,3],[6,77,2]], [[0,76,2],[2,74,2],[4,73,2],[6,74,2]],
    [[0,76,3],[3,73,3],[6,69,2]], [[0,67,2],[2,69,2],[4,70,2],[6,73,2]],
    [[0,74,3],[3,69,3],[6,65,2]], [[0,62,4],[4,74,2]]
  ];
  function tone(f, t, d, type, g, cut){
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.type = type; o.frequency.value = f;
    let node = o;
    if (cut){ const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = cut; o.connect(fl); node = fl; }
    node.connect(a); a.connect(master);
    a.gain.setValueAtTime(0.0001, t);
    a.gain.exponentialRampToValueAtTime(g, t + 0.015);
    a.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d + 0.05);
  }
  // «bandoneón»: dos sierras levemente desafinadas y filtradas
  const lead = (m, t, d) => [-7, 7].forEach(c => tone(n2f(m) * Math.pow(2, c / 1200), t, d, "sawtooth", 0.05, 1900));
  function perc(t, g){
    const len = 0.045, b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * len), ctx.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), a = ctx.createGain();
    src.buffer = b; hp.type = "highpass"; hp.frequency.value = 2600; a.gain.value = g;
    src.connect(hp); hp.connect(a); a.connect(master); src.start(t);
  }
  function sched(s, t){
    const bar = Math.floor(s / 8) % 16, pos = s % 8, c = CH[bar], b = BASS[c];
    if (pos === 0) tone(n2f(b[0]), t, S * 3, "triangle", 0.34);
    if (pos === 3) tone(n2f(b[1]), t, S * 3, "triangle", 0.26);
    if (pos === 6) tone(n2f(b[2]), t, S * 2, "triangle", 0.24);
    if (pos === 4) CHORD[c].forEach(m => tone(n2f(m), t, S * 1.6, "square", 0.018, 1300));
    if (pos === 0 || pos === 4) perc(t, pos === 0 ? 0.12 : 0.07);
    for (const [p, m, d] of MEL[bar]) if (p === pos) lead(m, t, S * d * 0.95);
  }
  function tick(){ while (next < ctx.currentTime + 0.25){ sched(step, next); next += S; step = (step + 1) % 128; } }
  return {
    get on(){ return on },
    start(){
      try {
        if (!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); }
        ctx.resume();
        if (!timer){ next = ctx.currentTime + 0.08; step = 0; timer = setInterval(tick, 40); }
        on = true;
      } catch(e){ on = false; }
    },
    stop(){ clearInterval(timer); timer = null; on = false; try { ctx && ctx.suspend(); } catch(e){} }
  };
})();

  const t = Music.on ? "Apagar la música" : "Encender la música";

}

async function playEntrance(my){
  const stage = document.getElementById("stage"), sk = document.getElementById("skipIntro");
  let done = false;
  const alive = () => !done && my === token;
  function finish(){
    if (done || my !== token) return;
    done = true; menuSeen = true;
    stage.querySelectorAll(".walker").forEach(w => w.remove());
    stage.classList.remove("doors-open");
    stage.insertAdjacentHTML("beforeend", `<div class="walker" style="left:14%">${fig("betty","happy")}</div>`);
    sk.hidden = true;
    document.getElementById("tag").hidden = false;
    document.getElementById("mbtns").hidden = false;
    (document.getElementById("m-cont") || document.getElementById("m-new")).focus({preventScroll:true});
  }
  sk.hidden = false; sk.onclick = finish;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !stage.animate){ finish(); return; }

  const intoDoor = async w => {
    stage.classList.add("doors-open");
    const b = w.animate([{transform:"scale(1)", opacity:1}, {transform:"scale(.7) translateY(-8%)", opacity:0}], {duration:420, fill:"forwards"});
    try { await b.finished } catch(e){}
    w.remove();
  };
  const walk = async (k, mood) => {
    const w = document.createElement("div");
    w.className = "walker walking"; w.innerHTML = fig(k, mood); stage.appendChild(w);
    const a = w.animate([{left:"-14%"}, {left:"44.5%"}], {duration:2600, easing:"linear", fill:"forwards"});
    try { await a.finished } catch(e){ return }
    if (!alive()) return;
    await intoDoor(w);
  };
  const ps = [];
  for (let i = 0; i < ENTRAN.length; i++){
    if (!alive()) return;
    ps.push(walk(ENTRAN[i], i % 3 === 0 ? "happy" : "neutral"));
    await sleep(520);
  }
  await Promise.all(ps);
  if (!alive()) return;
  stage.classList.remove("doors-open");
  await sleep(500);
  if (!alive()) return;

  // Betty llega de última, se detiene… y se atreve.
  const w = document.createElement("div");
  w.className = "walker walking"; w.innerHTML = fig("betty","neutral") + `<div class="say"></div>`;
  stage.appendChild(w);
  let a = w.animate([{left:"-14%"}, {left:"24%"}], {duration:1800, easing:"ease-out", fill:"forwards"});
  try { await a.finished } catch(e){ return }
  if (!alive()) return;
  w.classList.remove("walking");
  const f = w.querySelector(".fig"), say = w.querySelector(".say");
  f.classList.add("talk");
  await typeInto(say, "¡Ay, Dios mío! Mi primer día en Ecomoda…", my, 42);
  f.classList.remove("talk");
  await sleep(900);
  if (!alive()) return;
  say.remove(); w.classList.add("walking");
  stage.classList.add("doors-open");
  a = w.animate([{left:"24%"}, {left:"44.5%"}], {duration:1300, easing:"linear", fill:"forwards"});
  try { await a.finished } catch(e){ return }
  if (!alive()) return;
  await intoDoor(w);
  stage.classList.remove("doors-open");
  await sleep(450);
  finish();
}

/* ================= Partida guardada en el navegador ================= */
const SAVE_KEY = "betty-save-v1";
function saveGame(){
  try {
    if (st.view === "game" || st.view === "inter") localStorage.setItem(SAVE_KEY, JSON.stringify({st, at:Date.now()}));
    else if (st.view === "end") localStorage.removeItem(SAVE_KEY);
  } catch(e){}
}
function loadGame(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (d && d.st && Number.isInteger(d.st.i) && d.st.i >= 0 && d.st.i < QS.length && Array.isArray(d.st.order) && Array.isArray(d.st.log)) return d;
  } catch(e){}
  return null;
}
function continueGame(){
  const d = loadGame(); if (!d) return start();
  st = Object.assign({qi:0}, d.st);
  render(); window.scrollTo({top:0});
}
window.addEventListener("pagehide", saveGame);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveGame(); });

function start(){
  st = {view:"game", i:0, score:0, picked:null, order:shuffle(4), log:[], qi:0};
  render(); window.scrollTo({top:0});
}

function hud(){
  const done = st.view !== "game" || st.picked !== null;
  const pct = ((st.i + (done?1:0)) / QS.length) * 100;
  return `<div class="hud">
    <span>Escena <b>${st.i+1}</b> de ${QS.length}</span>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <span>Aciertos <b>${st.score}</b></span>
  </div>`;
}

function optsHTML(q, done){
  return st.order.map((ai, pos) => {
    let cls = "";
    if (done){ cls = ai===0 ? "right" : ai===st.picked ? "wrong" : "dim"; }
    return `<button class="opt ${cls}" id="opt-${pos}" data-a="${ai}" ${done?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${esc(q.a[ai])}</span></button>`;
  }).join("");
}

function pick(a){
  st.picked = a;
  if (a === 0) st.score++;
  st.log.push(a === 0);
  render();
  document.querySelector(".diary")?.scrollIntoView({behavior:"smooth", block:"start"});
}
function next(){
  if (st.view === "game" && INTER[st.i]){ st.view = "inter"; st.qi = 0; render(); window.scrollTo({top:0}); return; }
  advance();
}
function advance(){
  if (st.i + 1 >= QS.length){ st.view = "end"; setBest(st.score); }
  else { st.view = "game"; st.i++; st.picked = null; st.order = shuffle(4); }
  render(); window.scrollTo({top:0});
}

function wireInter(text, my, speed){
  const sk = document.getElementById("skip"), cont = document.getElementById("cont");
  sk.onclick = () => { skip = true; };
  cont.onclick = () => { st.qi++; if (st.qi < INTER[st.i].length){ render(); window.scrollTo({top:0}); } else advance(); };
  typeInto(document.getElementById("txt"), text, my, speed).then(() => {
    if (my !== token) return;
    document.querySelector(".writer .fig")?.classList.remove("write");
    const q = document.getElementById("quote"); if (q) q.hidden = false;
    sk.hidden = true; cont.hidden = false; cont.focus({preventScroll:true});

    <div class="qgrid">
      ${FRASES.map((f,i) => `<button class="quote-card" id="fr-${i}" data-i="${i}">${fig(f.k, f.m)}
        <div><div class="qt">«${esc(f.t)}»</div>
        <div class="by">${esc(CAST[f.k].full || CAST[f.k].n)}${CAST[f.k].a ? ` · ${esc(CAST[f.k].a)}` : f.term ? " · todo Ecomoda" : ""}</div>
        <div class="cx">${esc(f.c)}</div></div></button>`).join("")}
    </div>
    <h3>Fuentes</h3>
    <ul class="sources">${Object.values(SRC).map(s => `<li><a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join("")}</ul>
  </section>`;
  document.getElementById("back").onclick = () => { st.view = st.log.length && st.i + 1 >= QS.length && st.picked !== null ? "end" : "intro"; render(); window.scrollTo({top:0}); };
  app.querySelectorAll(".quote-card").forEach(b => b.onclick = async () => {
    const f = FRASES[+b.dataset.i], qt = b.querySelector(".qt"), fg = b.querySelector(".fig");
    const my = token; skip = false;
    fg.classList.add("talk");
    qt.textContent = "";
    await typeInto(qt, `«${f.t}»`, my, 45);
    fg.classList.remove("talk");
  });
}

function renderEnd(){
  const r = [...RANKS].reverse().find(r => st.score >= r.min);
  app.innerHTML = `
  <section class="end">
    <span class="eyebrow">Fin de la novela</span>
    <div class="end-top">${fig(r.k, r.m)}<div class="big">${st.score}<small> / ${QS.length}</small></div></div>
    <div class="rank"><h2>${esc(r.t)}</h2><p>${esc(r.d)}</p></div>
    <ul class="review">
      ${QS.map((q,i) => `<li><b class="${st.log[i]?"y":"n"}">${st.log[i]?"✓":"✗"}</b><span>${esc(q.q)} <i style="color:var(--muted)">${esc(q.a[0])}</i></span></li>`).join("")}
    </ul>
    <div class="cta-row">
      <button class="btn" id="again">Jugar otra vez</button>
      <button class="btn ghost" id="frases">Frases célebres</button>
      <button class="btn ghost" id="home">Ver el reparto</button>
    </div>
    ${credits()}
  </section>`;
  document.getElementById("again").onclick = start;
  document.getElementById("frases").onclick = () => { st.view = "frases"; render(); window.scrollTo({top:0}); };
  document.getElementById("home").onclick = () => { st.view = "intro"; render(); };
}


/* ================= App instalable (PWA) ================= */
let installEvt = null;
const IS_PHONE = matchMedia("(pointer:coarse)").matches && Math.min(screen.width, screen.height) < 820;
const IS_APP = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IN_APP_BROWSER = /FBAN|FBAV|Instagram|WhatsApp|Line\/|TikTok|Snapchat|; wv\)/.test(UA);
const IOS_NOT_SAFARI = IS_IOS && /CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);

function installTip(){ return ""; }

function renderGate(done){
  document.body.classList.add("gated");
  let steps;
  if (done) steps = `<p class="warn"><b>¡Listo!</b> Busca el ícono de Betty en tu pantalla de inicio y abre el juego desde ahí.</p>`;
  else if (IN_APP_BROWSER || IOS_NOT_SAFARI) steps = `<p class="warn">Este navegador no permite instalar apps. Copia el enlace y ábrelo en <b>${IS_IOS ? "Safari" : "Chrome"}</b>.</p>
      <div class="cta-row"><button class="btn" id="copy">Copiar enlace</button></div>`;
  else steps = `${installEvt ? `<div class="cta-row"><button class="btn" id="install">Instalar el juego</button></div>` : ""}
      ${installGuide(IS_IOS ? "ios" : "android")}`;
  app.innerHTML = `<section class="gate">
    <div class="hero-say">${fig("betty", done ? "happy" : "neutral", "talk")}<div class="bub"><span class="who">Betty</span><span class="tx" id="gsay"></span></div></div>
    <h2>Instala el juego para jugar</h2>
    <p>En el celular, <i>¿Y ahora qué, Betty?</i> se juega como una app: pantalla completa, con su propio ícono y sin conexión.</p>
    ${steps}
  </section>`;
  const my = ++token; skip = false;
  typeInto(document.getElementById("gsay"), done ? "¡Tan divino! Ya estoy en tu pantalla de inicio." : "Para entrar a Ecomoda, primero llévame a tu pantalla de inicio.", my, 32)
    .then(() => app.querySelector(".gate .fig")?.classList.remove("talk"));
  const ib = document.getElementById("install");
  if (ib) ib.onclick = async () => { installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome === "accepted") renderGate(true); else renderGate(false); };
  const cb = document.getElementById("copy");
  if (cb) cb.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cb.textContent = "Enlace copiado"; } catch(e){ cb.textContent = location.href; } };
}

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (IS_PHONE && !IS_APP()) renderGate(false); });
window.addEventListener("appinstalled", () => { if (IS_PHONE && !IS_APP()) renderGate(true); });
matchMedia("(display-mode: standalone)").addEventListener?.("change", () => location.reload());
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {});

window.claude?.hot?.snapshot?.(() => st);
const boot = data => { if (data && data.view) st = Object.assign({qi:0}, data); render(); };
if (IS_PHONE && !IS_APP()) renderGate(false);
else window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
